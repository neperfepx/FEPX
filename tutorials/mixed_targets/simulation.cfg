## FEPX tutorial "Mixed targets": the 20-grain fcc polycrystal of the simple simulation loaded
## along z to 1 % strain, unloaded to zero stress and reloaded to 1.5 % strain, each step ending
## at a target of another kind.

## Material
number_of_phases 1
phase 1
  crystal_type FCC
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.5e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 3
#                 comp  step 1    step 2    step 3
strain_rate       33    1.0e-3   -1.0e-3    1.0e-3
target_strain     33    0.010     -         0.015
target_stress     33    -         0.0       -
number_of_incrs         10        -         8
dtime                   -         0.5       -
dtime_min               -         0.01      -

## Output
print coo
print stress
print strain
print forces
