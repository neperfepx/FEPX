## FEPX tutorial "Overwriting polycrystal attributes": a 50-grain two-phase polycrystal whose
## phases and orientations are read from simulation.phase and simulation.ori, loaded along z to
## 425 N and unloaded.

## Material
number_of_phases 2
phase 1
  crystal_type FCC
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0
phase 2
  crystal_type BCC
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0

## Input files
read_ori_from_file
read_phase_from_file

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 2
strain_rate 33 1e-2  -1e-2
target_load 33 425.0  0.0
dtime          0.1    0.1
dtime_min      0.01   0.01

## Output
print forces
print ori
print coo
print defrate_eq
print work
print stress
print strain
