## FEPX tutorial "hcp single crystal": a single crystal of alpha-phase Ti-6Al-4V pulled
## along z, in three orientations (simulation_basal.ori, simulation_prismatic.ori,
## simulation_pyramidal.ori) that favor basal, prismatic and pyramidal <c+a> slip.

## Material
number_of_phases 1
phase 1
  crystal_type HCP
  model crystal_plasticity
  c11 1.6966e5
  c12 0.8866e5
  c13 0.6166e5
  c33 1.9666e5
  c44 0.4250e5
  c_over_a 1.587
  m 0.01 0.01 0.01
  gammadot_0 1.0 1.0 1.0
  tau_0 390.0 468.0 663.0
  hardening saturation_isotropic
  h_0 190.0
  tau_s 700.0
  n 1.0

## Input files
read_ori_from_file

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 8
#                  step 1  step 2  step 3  step 4  step 5  step 6  step 7  step 8
strain_rate   33   1.0e-3  1.0e-3  1.0e-3  1.0e-3  1.0e-3  1.0e-3  1.0e-3  1.0e-3
target_strain 33   0.0025  0.0050  0.0075  0.0100  0.0125  0.0150  0.0175  0.0200
dstrain            2.5e-4  2.5e-4  2.5e-4  2.5e-4  2.5e-4  2.5e-4  2.5e-4  2.5e-4

## Output
print coo
print stress
print strain
print sliprate
print slip
print forces
