## FEPX tutorial "Simple RVE-type simulation": the simple simulation loaded by a strain rate to
## a strain target with strain increments, the uniaxial_minimal preset.

## Material
number_of_phases 1
phase 1
  crystal_type FCC
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.5e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 1
strain_rate   33 0.001
target_strain 33 0.01
dstrain          0.001

## Output
print coo
print ori
print stress
print strain
print forces
