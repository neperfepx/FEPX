## FEPX tutorial "Cruciform specimen": a 98-grain fcc cruciform specimen (1 x 1 x 0.1 mm)
## under biaxial loading, the velocities along y half those along x (biaxiality 0.5).

## Material
number_of_phases 1
phase 1
  crystal_type FCC
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.5e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

## Loading
boundary_conditions general
set_bc vel x0 x -0.01
set_bc vel x1 x  0.01
set_bc vel y0 y -0.005
set_bc vel y1 y  0.005
set_bc vel x0z0cut1 z 0
number_of_steps 1
target_time 1.0
dtime       0.01

## Output
print coo
print ori
print stress
print strain
print forces
