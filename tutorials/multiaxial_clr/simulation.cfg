## FEPX tutorial "Multiaxial control at a constant load rate": a 50-grain fcc/bcc polycrystal
## (LDX-2101 steel) loaded at 2 N/s on 33 with the loads in fixed ratios, a 75 s dwell, unloading.

## Material
number_of_phases 2
phase 1
  crystal_type FCC
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0
phase 2
  crystal_type BCC
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0

## Loading
boundary_conditions triaxial
control_component 33
number_of_steps 4
#                 comp  step 1  step 2   step 3   step 4
load_rate         33    2.0     2.0      0.0     -2.0
target_load       33    100.0   250.0    -        0.0
target_duration         -       -        75.0     -
target_load       11   -37.50  -93.75   -        0.0
target_load       22   -62.50  -156.25  -        0.0
load_rate         11    -       -        0.0      -
load_rate         22    -       -        0.0      -
number_of_incrs         1       3        -        4
dtime                   -       -        25.0     -
max_strain_incr 0.002

## Output
print coo
print crss
print forces
print stress
print strain
