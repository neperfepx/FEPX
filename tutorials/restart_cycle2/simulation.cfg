## FEPX tutorial "Restarting a simulation", second run (in the directory of the first): reloading
## to 230 N and unloading to 0 N, written as steps 3 and 4.

## Material
number_of_phases 1
phase 1
  crystal_type FCC
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 160.0
  hardening saturation_isotropic
  h_0 375.0
  tau_s 1000.0
  n 1.0
  cyclic_hardening on
  cyclic_a 0.05
  cyclic_c 3.5

## Loading
restart on
boundary_conditions triaxial
control_component 33
number_of_steps 2
#                 comp  step 1  step 2
strain_rate       33    1e-4   -1e-4
target_load       33    230.0   0.0
target_load       11    0.0     0.0
target_load       22    0.0     0.0
dtime                   2.5     2.5
dtime_min               0.25    0.25

## Output
print defrate_pl_eq
print slip
print sliprate
print coo
print forces
print restart
print stress
print strain
