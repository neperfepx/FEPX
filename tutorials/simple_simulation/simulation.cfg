## FEPX tutorial "Simple simulation": a 20-grain fcc polycrystal in the unit cube pulled
## along z at 0.001 mm/s, the conditions given node set by node set, two steps of 5 s.

## Material
number_of_phases 1
phase 1
  crystal_type FCC
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.5e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

## Loading
boundary_conditions general
set_bc vel z0 z 0
set_bc vel z1 z 0.001
set_bc vel x0y0z0 x 0 y 0
set_bc vel x1y0z0 y 0
number_of_steps 2
target_time 5.0 10.0
dtime       1.0  1.0

## Output
print coo
print ori
print stress
print strain
print forces
