## Regression case tight_poly_fcc_part2_jacobi (step 9.2, addendum_block_jacobi.md §6 T6, Q-B1): the
## case tight_poly_fcc_part2 with the Jacobi preconditioner, compared with that case's reference
## (block-Jacobi, the default since the study): every tolerance tightened, so the two preconditioners must
## agree to fepx_own_tol.
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.006
number_of_incrs  2     2
initialization isotropic_viscoplastic
midnode_linearization on
global_tol 1e-10
global_tol_slow 1e-10
global_tol_abs 1e-16
cg_tol 1e-13
point_tol 1e-11
point_tol_state 1e-12
point_tol_hardening 1e-12
point_max_iters_state 400

print coo
print disp
print vel
print ori
print stress
print stress_eq
print strain
print strain_eq
print strain_el
print strain_el_eq
print strain_pl
print strain_pl_eq
print crss
print slip
print sliprate
print rss
print defrate
print defrate_eq
print defrate_pl
print defrate_pl_eq
print velgrad
print spinrate
print rotrate
print rotrate_spin
print rotrate_slip
print work
print work_pl
print workrate
print workrate_pl

## Solver (step 9.2)
cg_preconditioner jacobi
