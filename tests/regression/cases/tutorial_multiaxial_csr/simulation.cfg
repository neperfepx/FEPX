## FEPX regression case tutorial_multiaxial_csr (step 8.5; the manual's own
## inputs are in tutorials/): FEPX v2's tutorial
## legacy/fepx2-fixed/tutorials/triaxCSR (multiaxial_csr.rst; inputs repaired in v2-fixed,
## CHANGES.md C90; g_s0 700 above the pyramidal tau_0 663, C96) in FEPX syntax. 50-grain hcp polycrystal (Ti-6Al-4V alpha phase;
## meshes/tutorial_triax.msh, v2's tutorial mesh at msh version 2.4), triaxial control at a
## constant strain rate on 11 in compression, 22 and 33 load-controlled on each step's load path
## to the loads (-300, 0, 300) and (-600, 0, 600) N; the strain rate doubled in step 2 (v2's
## strain_rate_jump). v2's hcp stiffness constraint c33 = c11 + c12 - c13; anisotropic hardening
## with v2's eight-value co-planar matrix (1.0 1.4 ... 1.4: basal block 3 x 3 with 1.4 off the
## diagonal, the prismatic systems alone, the pyramidal <c+a> systems in co-planar pairs (7, 8),
## ..., (17, 18), 0 between blocks) written out; saturation strength evolution. v2's tolerance
## max(load_tol_abs 10, load_tol_rel 0.01 |F|) is 10 N below 1000 N: load_tol 10. Compared with
## the v2-fixed reference of tutorial_multiaxial_csr (tests/regression/README.md).

## Material
number_of_phases 1
phase 1
  crystal_type hcp
  model crystal_plasticity
  c11 1.6966e5
  c12 0.8866e5
  c13 0.6166e5
  c33 1.9666e5
  c44 0.4250e5
  c_over_a 1.587
