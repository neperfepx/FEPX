  gammadot_0 1.0 1.0 1.0
  tau_0 390.0 468.0 663.0
  hardening saturation_anisotropic
  h_0 190.0
  tau_s 700.0
  n 1.0
  saturation_evolution on
  gammadot_s0 1.0
  m_prime 1.1
