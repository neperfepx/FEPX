## Loading
boundary_conditions triaxial
control_component 11
number_of_steps 2
#                 comp  step 1  step 2
strain_rate       11   -1e-4   -2e-4
target_load       11   -300.0  -600.0
target_load       22    0.0     0.0
target_load       33    300.0   600.0
dtime                   5.0     10.0
dtime_min               0.25    0.25
load_tol 10.0

## Started as v2 (the velocities of an isotropic viscoplastic solve and a yield-surface vertex
## stress), with the mid-nodes kept on the element edges as in v2's solves
