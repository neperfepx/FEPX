## FEPX regression case iso_uniaxial_clr_triaxial (step 8.2c,
## addendum_triaxial_load_control.md §5 V2): iso_uniaxial_clr with boundary_conditions
## triaxial, the control component 33 the only one with rows (11 and 22 free: no rows), which
## are the conditions of uniaxial_symmetry. Compared with iso_uniaxial_clr's results of the
## same build (SAME_AS): the same solves, to round-off.
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

boundary_conditions triaxial
control_component 33
number_of_steps 2
#                 comp  step 1  step 2
load_rate         33    50.0   -50.0
target_load       33    100.0   20.0
number_of_incrs         4       4
load_tol 0.01

print coo
print disp
print vel
print stress
print strain_el
print forces
