## FEPX regression case tutorial_simple_simulation (step 8.5; the manual's own
## inputs are in tutorials/): FEPX v2's tutorial of the same name
## (legacy/fepx2-fixed/tutorials/simple_simulation, n 1.0 as in v2-fixed, CHANGES.md C94) in
## FEPX syntax. 20-grain fcc polycrystal in the unit cube (meshes/tutorial_simple.msh, v2's
## tutorial mesh at msh version 2.4), z1 pulled along z at 0.001 mm/s with z0 fixed along z and
## two corners fixed against rigid-body motion, in two steps of 5 s with 1 s increments.
## Compared with the v2-fixed reference of tutorial_simple_simulation (tests/regression/README.md).

## Material
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.5e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

## Loading
boundary_conditions general
set_bc vel z0 z 0
set_bc vel z1 z 0.001
set_bc vel x0y0z0 x 0 y 0
set_bc vel x1y0z0 y 0
number_of_steps 2
target_time 5.0 10.0
dtime       1.0  1.0

## Started as v2 (the velocities of an isotropic viscoplastic solve and a yield-surface vertex
## stress), with the mid-nodes kept on the element edges as in v2's solves
initialization isotropic_viscoplastic
midnode_linearization on

## Output
print coo
print ori
print stress
print strain
print forces
