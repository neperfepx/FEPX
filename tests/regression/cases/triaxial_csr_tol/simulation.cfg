## FEPX regression case triaxial_csr_tol (step 8.2b, addendum_triaxial_load_control.md §5
## V3): triaxial_csr with the tightened tolerances of v2-fixed case triaxial_csr_tol (load_tol
## 0.05 N, dtime_factor 1.0, dtime_min 1e-6, global and CG tolerances 1e-7 and 1e-13), compared with
## its full-precision HDF5 output (tests/regression/README.md). The same increments as v2-fixed;
## the remaining differences are of the order of the load tolerance (each code stops its iteration
## anywhere within 0.05 N of its values to reach; FEPX's load path starts at the measured values,
## Q-T4, v2's at the previous step's targets).
number_of_phases 1
phase 1
  crystal_type hcp
  model crystal_plasticity
  c11 1.6966e5
  c12 0.8866e5
  c13 0.6166e5
  c33 1.9666e5
  c44 0.4250e5
  c_over_a 1.587
  m 0.01 0.01 0.01
  gammadot_0 1.0 1.0 1.0
  tau_0 390.0 468.0 663.0
  hardening saturation_isotropic
  h_0 190.0
  tau_s 530.0
  n 1.0

boundary_conditions triaxial
control_component 11
number_of_steps 2
#                 comp  step 1  step 2
strain_rate       11   -1e-4   -1e-4
target_load       11   -300.0  -600.0
target_load       22    0.0     0.0
target_load       33    300.0   600.0
dtime                   5.0     10.0
dtime_min               1e-6    1e-6
load_tol 0.05
dtime_factor 1.0
global_tol 1e-7
global_tol_slow 1e-7
global_tol_abs 1e-16
cg_tol 1e-13
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print vel
print crss
print defrate
print defrate_eq
print defrate_pl
print defrate_pl_eq
print ori
print slip
print sliprate
print spinrate
print rotrate
print strain
print strain_eq
print strain_el
print strain_el_eq
print strain_pl
print strain_pl_eq
print stress
print stress_eq
print velgrad
print work
print work_pl
print workrate
print workrate_pl
