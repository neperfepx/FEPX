## FEPX regression case tutorial_overwriting (step 8.5; the manual's own
## inputs are in tutorials/): FEPX v2's tutorial legacy/fepx2-fixed/tutorials/overwriting
## (overwriting.rst; input repaired in v2-fixed, CHANGES.md C92) in FEPX syntax. 50-grain
## two-phase polycrystal (LDX-2101 steel), the phases from simulation.phase (grains 1-25 fcc,
## 26-50 bcc) and per-element orientations from simulation.ori (each grain's orientation spread
## by a normal distribution of 5 degrees); the mesh and orientation files are regenerated by the
## tutorial's Neper commands (meshes/tutorial_overwriting.*; the tutorial's own mesh lacks the
## corner node sets of the minimal conditions). Uniaxial loading along z with minimal conditions
## to 425 N and unloading to 0 N, at 1e-2 /s, dtime 0.1 s, dtime_min 0.01 s. load_tol 2 N (not in
## v2's tutorial): with the tutorial's dtime_min v2 passes 425 N by 1.27 N, 1.20 N after being
## short of it, so that no FEPX landing tolerance (addendum_triaxial_load_control.md §3.6) gives
## v2's increments; with load_tol 2 in both (v2: completed within load_tol short of the target,
## C64) both end the step at the same increment. Compared with the v2-fixed reference of
## tutorial_overwriting, run on cases/tutorial_overwriting (tests/regression/README.md).

## Material
number_of_phases 2
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0
phase 2
  crystal_type bcc
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0

## Input files
read_ori_from_file
read_phase_from_file

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 2
strain_rate 33 1e-2  -1e-2
target_load 33 425.0  0.0
dtime          0.1    0.1
dtime_min      0.01   0.01
load_tol 2.0

## Started as v2 (the velocities of an isotropic viscoplastic solve and a yield-surface vertex
## stress), with the mid-nodes kept on the element edges as in v2's solves
initialization isotropic_viscoplastic
midnode_linearization on

## Output
print forces
print ori
print coo
print defrate_eq
print work
