## FEPX regression case poly_fcc_cyclic_subincr (step 7.3, Q35, D63): poly_fcc_cyclic with
## subincrementation on (no v2 counterpart), compared with FEPX's own reference (reference/fepx;
## tests/regression/README.md). Without it, point solves fail at the converged velocities in increments 6-8;
## with it, increments 6, 7 and 8 are solved as 3 sub-increments (down to dt/4) and increment 16 as 2, and no
## point is left failed. Default solver tolerances (with every tolerance tightened, one point of increment 6
## still fails at dt/16 and the run stops at subincrement_max_depth: ROADMAP 7.3).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0
  cyclic_hardening on
  cyclic_a 0.002
  cyclic_c 3.5

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  -0.01
target_strain 33 0.004 0.000
number_of_incrs  8     8
initialization isotropic_viscoplastic
midnode_linearization on
subincrementation on

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
