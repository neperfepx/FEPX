## FEPX regression case sx_fcc_sat_evo (step 7.1): v2-fixed case sx_fcc_sat_evo in FEPX syntax, started as v2
## (initialization isotropic_viscoplastic), compared with its v2-fixed reference (tests/regression/README.md).
## Saturation-strength evolution with tau_s above tau_0 (m_prime 0.05, gammadot_s0 0.01: tau_s about 330-350 MPa;
## v2's own cases 06-09 use values for which tau_s stays below tau_0 and nothing hardens).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0
  saturation_evolution on
  gammadot_s0 0.01
  m_prime 0.05

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.010
number_of_incrs  5     5
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
