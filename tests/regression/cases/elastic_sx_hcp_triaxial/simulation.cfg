## FEPX regression case elastic_sx_hcp_triaxial (ROADMAP step 5.4): FEPX counterpart of
## the v2-fixed case elastic_sx_hcp_triaxial (HCP single crystal rotated 45 deg about x
## (sx2_rotx45.msh), triaxial strain control (D45; v2: three minimal strain-rate conditions, steps
## timed by the largest rate, 33)), compared with its v2-fixed reference. Same material and
## loading; for HCP c33 = c11 + c12 - c13 (v2's constraint); midnode_linearization on (v2 resets
## the tet mid-nodes, D26).

## Material
number_of_phases 1
phase 1
  crystal_type hcp
  model elastic
  c11 1.6240e5
  c12 0.9200e5
  c13 0.6900e5
  c33 1.85400e+05
  c44 0.4670e5

## Loading
boundary_conditions triaxial
control_component   33
number_of_steps 2
strain_rate   33  1.0e-2   1.0e-2
target_strain 33  0.0005   0.0010
strain_rate   11 -0.25e-2 -0.25e-2
strain_rate   22 -0.3e-2  -0.3e-2
number_of_incrs     2        2
midnode_linearization on

## Output
print coo
print disp
print vel
print forces
print ori
print stress
print strain_el
