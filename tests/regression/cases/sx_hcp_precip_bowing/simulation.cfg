## FEPX regression case sx_hcp_precip_bowing (step 7.1): v2-fixed case sx_hcp_precip_bowing in FEPX syntax, started as v2
## (initialization isotropic_viscoplastic), compared with its v2-fixed reference (tests/regression/README.md).
## Precipitate bowing only (c_p, b_m; v2 also needs b_p, unused, which FEPX does not take): tau_p with the Hill
## shear modulus of the hcp crystal (v2's c33 = c11 + c12 - c13).
number_of_phases 1
phase 1
  crystal_type hcp
  model crystal_plasticity
  c11 1.6966e5
  c12 0.8866e5
  c13 0.6166e5
  c33 1.9666e5
  c44 0.4250e5
  c_over_a 1.587
  m 0.01 0.01 0.01
  gammadot_0 1.0 1.0 1.0
  tau_0 390.0 468.0 663.0
  hardening saturation_isotropic
  h_0 190.0
  tau_s 530.0
  n 1.0
  precipitate_strengthening on
  f_p 8.0e-2
  r_p 4e-9
  b_m 2.0e-10
  c_p 1.6e-1

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.010
number_of_incrs  5     5
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
