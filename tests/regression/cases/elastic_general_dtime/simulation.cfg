## FEPX regression case elastic_general_dtime (ROADMAP step 5.4): FEPX counterpart of the
## v2-fixed case elastic_general_dtime (8-grain BCC polycrystal (poly_part2.msh), general
## conditions, time targets with dtime), compared with its v2-fixed reference. Same material and
## loading; for HCP c33 = c11 + c12 - c13 (v2's constraint); midnode_linearization on (v2 resets
## the tet mid-nodes, D26).

## Material
number_of_phases 1
phase 1
  crystal_type bcc
  model elastic
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3

## Loading
boundary_conditions general
set_bc vel x0y0z0 x 0 y 0 z 0
set_bc vel x1y0z0 y 0
set_bc vel z0 z 0
set_bc vel z1 z 0.1
number_of_steps 2
target_time 0.02  0.03
dtime       0.002 0.002
midnode_linearization on

## Output
print coo
print disp
print vel
print forces
print ori
print stress
print strain_el
