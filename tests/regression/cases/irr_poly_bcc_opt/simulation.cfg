## FEPX regression case irr_poly_bcc_opt (step 7.3, D61/D62): Kocks-Mecking hardening with
## irradiation softening (no v2 counterpart), bcc iron with Barton et al. (2013)'s parameters in FEPX
## units on the 8-grain polycrystal; the loop density per elset from simulation.opt
## ($ElsetIrrLoopDensity, 1.5e12 to 5.5e12 /mm^3; irr_loop_density replaced), the loop diameter from
## the cfg (100 b), <111> loops. Elastic to 0.3 %, then 84 increments of 5e-4 to 4.5 %: the peak
## stress (0.55 %), the stress drop, the minimum (about 2.6 %) and the re-hardening (Kocks-Mecking
## dominant). Default solver tolerances (user, 2026-10-12: tightened ones cost about 30 s per
## increment); the damped state loop. Compared with FEPX's own reference (reference/fepx;
## tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 231.4e3
  c12 134.7e3
  c44 116.4e3
  m 0.05
  gammadot_0 1.0
  tau_0 90.0
  hardening kocks_mecking
  km_b 2.48e-7
  km_h_n 0.125
  km_k1 4.5e5
  km_k20 14.0
  km_gammadot_k0 1.0e10
  km_n 100.0
  km_rho_0 2.0e7
  irradiation on
  irr_h_d 0.675
  irr_eta 100.0
  irr_loop_density 1.0e12
  irr_loop_diameter 2.48e-5
  irr_loop_normals <111>

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.003 0.045
number_of_incrs  3     84
read_from_opt_file
initialization isotropic_viscoplastic

print coo
print disp
print forces
print ori
print stress
print strain_pl
print crss
print slip
print km_rho
print km_k2
print dmg
print dmgrate
