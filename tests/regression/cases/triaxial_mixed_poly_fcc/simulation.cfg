## FEPX regression case triaxial_mixed_poly_fcc (step 8.2b, addendum_triaxial_load_control.md
## §5 V5, the parts available in 8.2b; not in v2): triaxial load control of the 8-grain fcc
## polycrystal (poly_part2.msh), control component 33: (1) strain to 0.8 % (past yield) with the
## stress 11 interpolated in time to -50 MPa (Q-T8 (ii)), 22 free; (2) unloading at a constant
## strain rate to the stress target 100 MPa, 11 on the load path to 0 MPa (v2 CSR; a step planned
## during the run, its path from the measured start values, Q-T4); (3) reloading past yield to
## 375 MPa, 11 on the path to -100 MPa. Default solver tolerances, stress_tol 0.01 MPa; compared
## with FEPX's own reference (tests/regression/README.md), and on 1, 2 and 4 ranks
## (verification_fepx_rank_independence_triaxial).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

boundary_conditions triaxial
control_component 33
number_of_steps 3
#                comp  step 1  step 2  step 3
strain_rate      33    0.01   -0.01    0.01
target_strain    33    0.008   -       -
target_stress    33    -       100.0   375.0
target_stress    11   -50.0    0.0    -100.0
number_of_incrs        8       -       -
dtime                  -       0.05    0.1
dtime_min              -       0.001   0.001
stress_tol 0.01

print coo
print disp
print forces
print stress
print strain
print strain_el
print strain_pl
print crss
