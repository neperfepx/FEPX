## FEPX regression case elastic_poly_fcc (ROADMAP step 5.4): FEPX counterpart of the
## v2-fixed case elastic_poly_fcc (8-grain FCC polycrystal (poly_part2.msh)), compared with its
## v2-fixed reference. Same material and loading; for HCP c33 = c11 + c12 - c13 (v2's constraint);
## midnode_linearization on (v2 resets the tet mid-nodes, D26).

## Material
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3

## Loading
boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01   0.01
target_strain 33 0.0005 0.0010
number_of_incrs  2      2
midnode_linearization on

## Output
print coo
print disp
print forces
print ori
print stress
print strain_el
