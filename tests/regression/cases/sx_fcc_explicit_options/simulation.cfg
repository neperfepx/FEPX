## FEPX regression case sx_fcc_explicit_options (step 9.6, ROADMAP D88): sx_fcc with
## the isotropic viscoplastic start and, so that every keyword of the configuration file is used
## by a run of the quick tests, the keywords no other run uses, at values that leave the results
## unchanged: the solver settings at their defaults, run limits that are not reached, and the
## orientation of the mesh file read from simulation.ori (the same orientation). Compared with
## the v2-fixed reference sx_fcc at the tolerances of sx_fcc (tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.010
number_of_incrs  5     5
initialization isotropic_viscoplastic
midnode_linearization on

## Orientations from simulation.ori (the mesh file's orientation).
read_ori_from_file

## Solver settings at their defaults (doc/keywords_table.rst).
cg_max_iters 16000
global_nr_switch 1e-2
global_nr_slow_ratio 0.2
point_max_iters_newton 100
point_max_iters_hardening 10

## Run limits that are not reached (the run ends at 1 % strain, after 1 s).
max_strain 0.5
max_eqstrain 0.5
max_total_time 100.0

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
