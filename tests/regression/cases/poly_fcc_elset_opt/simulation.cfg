## FEPX regression case poly_fcc_elset_opt (step 7.1): v2-fixed case poly_fcc_elset_opt in FEPX syntax, started as v2
## (initialization isotropic_viscoplastic), compared with its v2-fixed reference (tests/regression/README.md).
## Per-elset values from simulation.opt: $ElsetCrss (one value per elset), $ElsetCrssSat, $ElsetHardCoeff
## (v2: g_0, g_s0, h_0 from_file; FEPX: read_from_opt_file, the cfg values replaced).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.010
number_of_incrs  5     5
initialization isotropic_viscoplastic
midnode_linearization on
read_from_opt_file

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
