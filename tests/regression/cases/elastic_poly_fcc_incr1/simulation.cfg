## FEPX regression case elastic_poly_fcc_incr1 (ROADMAP step 4.4): FEPX counterpart of the v2-fixed
## case elastic_poly_fcc_incr1 (8-grain FCC polycrystal (poly_part2.msh)), compared with its v2-fixed reference.
## Same material and loading; c33 = c11 + c12 - c13 for HCP (v2's constraint) and
## midnode_linearization on (v2 resets the tet mid-nodes, D26).

## Material
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3

## Loading
boundary_conditions uniaxial_grip
number_of_steps 1
strain_rate   33 0.01
target_strain 33 0.00025
number_of_incrs  1
midnode_linearization on

## Output
print coo
print disp
print forces
print stress
print strain_el
