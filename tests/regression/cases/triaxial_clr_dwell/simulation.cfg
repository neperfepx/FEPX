## FEPX regression case triaxial_clr_dwell (step 8.2c, addendum_triaxial_load_control.md §5
## V3, V4): v2-fixed case triaxial_clr_dwell in FEPX syntax: LEGACY_triaxial_clr's material and
## control (2 N/s on 33, 11 and 22 load-controlled in time), load steps to 100, 250 and 300 N on
## 33 with a dwell after the first two (20 s and 10 s, load_rate 0 with target_duration, dtime 5:
## every load held where the previous step left it, load_rate 0 on 11 and 22 too, as v2-fixed C98;
## v2's dwell_episode time increment), max_strain_incr 0.002; v2's print flags (load 1, dwell 1,
## load 3 printed). midnode_linearization on (v2-fixed C65, D70); v2's equal load-step increments
## as number_of_incrs (see triaxial_clr). Compared with the v2-fixed reference of
## triaxial_clr_dwell (tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.90
  tau_s 335.0
  n 1.0

boundary_conditions triaxial
control_component 33
number_of_steps 5
#                 comp  step 1  step 2  step 3  step 4  step 5
load_rate         33    2.0     0.0     2.0     0.0     2.0
target_load       33    100.0   -       250.0   -       300.0
target_duration         -       20.0    -       10.0    -
target_load       11   -37.50  -       -93.75  -       -112.50
target_load       22    0.0     -       0.0     -       0.0
load_rate         11    -       0.0     -       0.0     -
load_rate         22    -       0.0     -       0.0     -
number_of_incrs         1       -       3       -       2
dtime                   -       5.0     -       5.0     -
print_results           1       1       0       0       1
load_tol 5.0
max_strain_incr 0.002
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print vel
print forces
print crss
print ori
print slip
print strain
print strain_el
print strain_pl
print stress
