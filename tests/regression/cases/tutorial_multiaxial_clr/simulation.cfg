## FEPX regression case tutorial_multiaxial_clr (step 8.5; the manual's own
## inputs are in tutorials/): FEPX v2's tutorial
## legacy/fepx2-fixed/tutorials/triaxCLR (multiaxial_clr.rst) in FEPX syntax. 50-grain
## two-phase polycrystal (LDX-2101 steel: fcc austenite in grains 1-25, bcc ferrite in grains
## 26-50; meshes/tutorial_triax_dual.msh, v2's tutorial mesh at msh version 2.4), triaxial
## control at a constant load rate of 2 N/s on 33, the loads in the ratios -0.375 : -0.625 : 1
## (11 and 22 load-controlled in time), to 100 N and 250 N, a dwell of 75 s holding the loads
## reached (v2's dwell_episode after load step 2; load_rate 0 on 33, 11 and 22: v2-fixed C98
## holds the loads reached, not the previous targets) and unloading to zero. v2 cuts each load
## step into max(nint(T / dt), 1) equal increments: number_of_incrs 1, 3 and 4 (T about 50, 75,
## 125 s from the loads reached; dt about 50, 25, 31.25 s); the dwell with dtime 25. max_strain_incr 0.002 and load_tol 5
## (v2's load_tol_abs) as in v2. Compared with the v2-fixed reference of
## tutorial_multiaxial_clr (tests/regression/README.md).

## Material
number_of_phases 2
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0
phase 2
  crystal_type bcc
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0

## Loading
boundary_conditions triaxial
control_component 33
number_of_steps 4
#                 comp  step 1  step 2   step 3   step 4
load_rate         33    2.0     2.0      0.0     -2.0
target_load       33    100.0   250.0    -        0.0
target_duration         -       -        75.0     -
target_load       11   -37.50  -93.75   -        0.0
target_load       22   -62.50  -156.25  -        0.0
load_rate         11    -       -        0.0      -
load_rate         22    -       -        0.0      -
number_of_incrs         1       3        -        4
dtime                   -       -        25.0     -
load_tol 5.0
max_strain_incr 0.002

## Started as v2 (the velocities of an isotropic viscoplastic solve and a yield-surface vertex
## stress), with the mid-nodes kept on the element edges as in v2's solves
initialization isotropic_viscoplastic
midnode_linearization on

## Output
print coo
print crss
print forces
