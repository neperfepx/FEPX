## FEPX regression case tutorial_periodic_rve (step 8.5; the manual's own
## inputs are in tutorials/): FEPX v2's tutorial of the same name
## (legacy/fepx2-fixed/doc/tutorials/periodic_rve_simulation) in FEPX syntax. 40-grain periodic
## bcc polycrystal (meshes/tutorial_periodic.msh, v2's tutorial mesh at msh version 2.4),
## plane-strain compression: strain rate 33 = -1e-2 /s, 22 = 23 = 0, 11, 12, 13 free, three
## strain increments of 0.001. v2's target_strain11 0.003 ends the step at 0.003 / 1e-2 = 0.3 s
## (v2 takes the step time from the largest imposed rate, whatever component the target names):
## FEPX's target_strain 33 -0.003 on the control component gives the same time. Compared with
## the v2-fixed reference of tutorial_periodic_rve after removing the mean translation
## (tests/regression/README.md).

## Material
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0

## Loading
boundary_conditions periodic
control_component 33
strain_rate 33 -1e-2
strain_rate 22 0
strain_rate 23 0
number_of_steps 1
target_strain 33 -0.003
dstrain 0.001

## Started as v2 (the velocities of an isotropic viscoplastic solve and a yield-surface vertex
## stress), with the mid-nodes kept on the element edges as in v2's solves
initialization isotropic_viscoplastic
midnode_linearization on

## Output
print coo
print disp
print forces
print strain
print strain_eq
print strain_el
print strain_el_eq
print strain_pl
print strain_pl_eq
print stress
print stress_eq
print work
print work_pl
print ori
print slip
print sliprate
print crss
