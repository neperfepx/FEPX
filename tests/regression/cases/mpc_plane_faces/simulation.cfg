## Material
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
