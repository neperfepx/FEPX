## FEPX regression case triaxial_clr_dual (step 8.2c, addendum_triaxial_load_control.md §5
## V3): v2-fixed case triaxial_clr_dual in FEPX syntax: LEGACY_triaxial_clr's loading on the
## two-phase mesh of 05_dual_bcc_fcc (fcc and bcc with LEGACY_triaxial_clr's hardening). FEPX's
## elastic estimate averages the phases by volume fraction (Q-T12; v2-fixed C59 by element
## counts): only the start of the iteration differs. midnode_linearization on (v2-fixed C65,
## D70); v2's equal load-step increments as number_of_incrs (see triaxial_clr). Compared
## with the v2-fixed reference of triaxial_clr_dual (tests/regression/README.md).
number_of_phases 2
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.90
  tau_s 335.0
  n 1.0
phase 2
  crystal_type bcc
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.90
  tau_s 335.0
  n 1.0

boundary_conditions triaxial
control_component 33
number_of_steps 3
#                 comp  step 1  step 2  step 3
load_rate         33    2.0     2.0    -2.0
target_load       33    100.0   250.0   0.0
target_load       11   -37.50  -93.75   0.0
target_load       22    0.0     0.0     0.0
number_of_incrs         1       3       4
load_tol 5.0
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print vel
print forces
print crss
print ori
print slip
print strain
print strain_el
print strain_pl
print stress
