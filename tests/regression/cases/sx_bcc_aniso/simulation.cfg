## FEPX regression case sx_bcc_aniso (step 7.4a): v2-fixed case sx_bcc_aniso in FEPX syntax
## (saturation_anisotropic with the default interaction matrix, 1 on the diagonal and 1.4 off
## it = v2's interaction_matrix_parameters 1.0 1.4), started as v2 (initialization isotropic_viscoplastic).
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_anisotropic
  h_0 391.90
  tau_s 335.0
  n 1.0

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.010
number_of_incrs  5     5
initialization isotropic_viscoplastic
midnode_linearization on

