## FEPX regression case sx_bcc_precip (step 7.4b): v2-fixed case sx_bcc_precip in FEPX syntax, started
## as v2 (initialization isotropic_viscoplastic), compared with its v2-fixed reference
## (tests/regression/README.md).
## BCC with precipitate strengthening, both parameter sets (v2 test 40_bcc_precipitates'
## values, a_p raised to 50 MPa as in sx_fcc_precip). Lengths in m as v2's cases (only
## ratios enter).
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0
  precipitate_strengthening on
  a_p 50.0
  f_p 8.0e-2
  b_p 2.5e-10
  r_p 4e-9
  b_m 2.0e-10
  c_p 1.6e-1

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.010
number_of_incrs  5     5
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
