## FEPX regression case poly_fcc_cyclic (step 7.1): v2-fixed case poly_fcc_cyclic in FEPX syntax, started as v2
## (initialization isotropic_viscoplastic), compared with its v2-fixed reference (tests/regression/README.md).
## Cyclic hardening (v2 hardening cyclic, a = 0.002, c = 3.5: a threshold reached during the run), 8-grain
## polycrystal, tension to 0.4 % then back to 0 at the same rate (v2 resets the accumulated slip; FEPX resets
## on every reversal of the control strain rate, D59).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0
  cyclic_hardening on
  cyclic_a 0.002
  cyclic_c 3.5

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  -0.01
target_strain 33 0.004 0.000
number_of_incrs  8     8
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
