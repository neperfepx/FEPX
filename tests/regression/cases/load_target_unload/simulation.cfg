## FEPX regression case load_target_unload (step 8.1): v2-fixed case load_target_unload in
## FEPX syntax (load past yield to 450 N, unload to 0 N; v2 reverses the velocities itself, FEPX
## takes the signed strain rates), started as v2 (initialization isotropic_viscoplastic), compared with the
## reference of v2-fixed case load_target_unload_tol (the same with load_tol 0.5;
## tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate 33 0.01 -0.01
target_load 33 450.0 0.0
dtime          0.05  0.05
dtime_min      0.001 0.002
# Landing tolerance above v2-fixed's largest overshoot in this case (0.35 N; step 8.2a):
# no increment is redone, and the v2-fixed reference uses the same tolerance (load_tol 0.5).
load_tol 0.5
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
