## FEPX regression case km_poly_fcc_rho_opt (step 7.2, D60): Kocks-Mecking hardening (no v2
## counterpart) on the 8-grain fcc polycrystal, the initial density per elset from simulation.opt
## ($ElsetRho0, 1e4 to 8e7 /mm^2, annealed to deformed; km_rho_0 replaced), every tolerance
## tightened, compared with FEPX's own reference (reference/fepx; tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 90.0
  hardening kocks_mecking
  km_b 2.48e-7
  km_h_n 0.125
  km_k1 4.5e5
  km_k20 14.0
  km_gammadot_k0 1.0e10
  km_n 100.0
  km_rho_0 1.0e5

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.010
number_of_incrs  2     4
read_from_opt_file
initialization isotropic_viscoplastic
global_tol 1e-10
global_tol_slow 1e-10
global_tol_abs 1e-16
cg_tol 1e-13
point_tol 1e-11
point_tol_state 1e-12
point_tol_hardening 1e-12
point_max_iters_state 400

print coo
print disp
print forces
print ori
print stress
print strain_pl
print crss
print slip
print km_rho
print km_k2
