## FEPX regression case pbc_poly_plane_strain (step 8.3b, V6): v2-fixed case
## pbc_poly_plane_strain in FEPX syntax (the control component 33, whose target -0.003 gives v2's
## step time), compared with its v2-fixed reference after removing the mean translation.

## Material (v2 tests 49 and 50)
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0

## Loading
boundary_conditions periodic
control_component 33
strain_rate 33 -1e-2
strain_rate 22 0
strain_rate 23 0
number_of_steps 1
target_strain 33 -0.003
dstrain 0.001
initialization isotropic_viscoplastic
midnode_linearization on

## Output
print coo
print disp
print vel
print ori
print stress
print strain_el
print strain_pl
print crss
print slip
