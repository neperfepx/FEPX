## FEPX regression case iso_uniaxial_clr (step 8.2c, addendum_triaxial_load_control.md §5
## V2, Q-T8 (iii)): a uniaxial preset at a constant load rate (iteration (B) on the one loaded
## component): the isotropic elastic unit cube of the verification case fepx_iso_triaxial_csr
## with uniaxial_symmetry, 33 at 50 N/s to 100 N, then at -50 N/s to 20 N. FEPX's own reference;
## iso_uniaxial_clr_triaxial (triaxial, only 33 load-controlled, 11 and 22 free) gives the
## same results; verification_fepx_iso_uniaxial_clr checks the load in time and Hooke's law.
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

boundary_conditions uniaxial_symmetry
number_of_steps 2
#                 comp  step 1  step 2
load_rate         33    50.0   -50.0
target_load       33    100.0   20.0
number_of_incrs         4       4
load_tol 0.01

print coo
print disp
print vel
print stress
print strain_el
print forces
