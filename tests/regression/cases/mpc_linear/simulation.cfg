## FEPX regression case mpc_linear (step 8.3a): v2-fixed case mpc_linear in FEPX syntax
## (elastic; set_mpc1 on x1 with a condition on its secondary node x1y1z1, C66; set_mpc on y1 with
## coefficient 0.5 and offset 2e-4, C67), compared with its v2-fixed reference
## (tests/regression/README.md).

## Material
number_of_phases 1
phase 1
  crystal_type bcc
  model elastic
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3

## Loading
boundary_conditions general
set_bc vel z0 z 0
set_bc vel z1 z 1e-2
set_bc vel x0y0z0 x 0 y 0 z 0
set_bc vel x0y1z0 x 0
set_mpc1 vel x1 x
set_bc vel x1y1z1 x 5e-4
set_mpc vel y1 y 0.5 2e-4
number_of_steps 2
target_strain 33 0.001  0.002
dstrain          0.0005 0.0005
midnode_linearization on

## Output
print coo
print disp
print vel
print forces
print ori
print stress
print strain_el
