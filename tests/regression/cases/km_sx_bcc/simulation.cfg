## FEPX regression case km_sx_bcc (step 7.2, D60): Kocks-Mecking hardening (no v2
## counterpart), bcc iron with Barton et al. (2013)'s parameters in FEPX units (addendum_kocks_mecking.md
## §2; mu_0 is Hill's average of the elastic constants), every tolerance tightened, compared with
## FEPX's own reference (reference/fepx; tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 231.4e3
  c12 134.7e3
  c44 116.4e3
  m 0.05
  gammadot_0 1.0
  tau_0 90.0
  hardening kocks_mecking
  km_b 2.48e-7
  km_h_n 0.125
  km_k1 4.5e5
  km_k20 14.0
  km_gammadot_k0 1.0e10
  km_n 100.0
  km_rho_0 2.0e7

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.020
number_of_incrs  2     6
initialization isotropic_viscoplastic
global_tol 1e-10
global_tol_slow 1e-10
global_tol_abs 1e-16
cg_tol 1e-13
point_tol 1e-11
point_tol_state 1e-12
point_tol_hardening 1e-12
point_max_iters_state 400

print coo
print disp
print forces
print ori
print stress
print strain_el
print strain_pl
print crss
print slip
print sliprate
print km_rho
print km_k2
print km_rhorate
