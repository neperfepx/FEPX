## FEPX regression case load_target_general (step 8.1): v2-fixed case load_target_general in
## FEPX syntax (general velocity conditions along x, load targets 400 N then 100 N, velocities
## reversed for the second step), started as v2 (initialization isotropic_viscoplastic), compared with the
## reference of v2-fixed case load_target_general_tol (the same with load_tol 0.5;
## tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

boundary_conditions general
set_bc vel x0 x 0.0 y 0.0 z 0.0
set_bc vel x1 x 0.01 y 0.0 z 0.0
number_of_steps 2
target_load 11 400.0 100.0
dtime          0.05  0.05
dtime_min      0.001 0.002
# Landing tolerance above v2-fixed's largest overshoot in this case (0.35 N; step 8.2a):
# no increment is redone, and the v2-fixed reference uses the same tolerance (load_tol 0.5).
load_tol 0.5
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
