## FEPX regression case sx_bcc_112 (step 7.4b): v2-fixed case sx_bcc_112 in FEPX syntax, started
## as v2 (initialization isotropic_viscoplastic), compared with its v2-fixed reference
## (tests/regression/README.md).
## BCC with the {110}<111> and {112}<111> families (v2 test 44_bcc_112_slip:
## g_0 200 MPa, g_0_bcc_112 240 MPa), isotropic hardening.
## v2's g_0_bcc_112 is the strength of the {112}<111> family.
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  slip_families {110}<111> {112}<111>
  m 0.02 0.02
  gammadot_0 1.0 1.0
  tau_0 200.0 240.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.010
number_of_incrs  5     5
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
