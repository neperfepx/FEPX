## FEPX regression case tutorial_restart_cycle2 (step 8.5; the manual's own
## inputs are in tutorials/): FEPX v2's restart tutorial (legacy/fepx2-fixed/tutorials/restart,
## restart.rst; inputs repaired in v2-fixed, CHANGES.md C91) in FEPX syntax. 50-grain fcc
## polycrystal (AL6XN steel; meshes/tutorial_triax.msh, v2's tutorial mesh at msh version 2.4)
## with cyclic hardening, triaxial control at a constant strain rate on 33, 11 and 22 held at
## zero load. Cycle 2, restarted from the end of cycle 1 (restart on; the
## configuration lists only the new steps, written as steps 3 and 4): reloading to 230 N and
## unloading to 0 N.
## v2's tolerance max(load_tol_abs 10, load_tol_rel 0.01 |F|) is 10 N below 1000 N: load_tol 10.
## The solver tolerances tightened in both inputs (global_tol 5e-6, global_tol_abs 1e-12, cg_tol
## 1e-10, point_tol 1e-6, point_tol_state 1e-7, point_tol_hardening 1e-6; v2-fixed case
## tutorial_restart_cycle2): at the defaults v2's point solve stops short at one element at the
## onset of slip (step 8.5, user decision D), here both codes agree to 2e-7 of each field's scale.
## Compared with the v2-fixed reference of tutorial_restart_cycle2 (tests/regression/README.md).

## Material
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 160.0
  hardening saturation_isotropic
  h_0 375.0
  tau_s 1000.0
  n 1.0
  cyclic_hardening on
  cyclic_a 0.05
  cyclic_c 3.5

## Loading
restart on
boundary_conditions triaxial
control_component 33
number_of_steps 2
#                 comp  step 1  step 2
strain_rate       33    1e-4   -1e-4
target_load       33    230.0   0.0
target_load       11    0.0     0.0
target_load       22    0.0     0.0
dtime                   2.5     2.5
dtime_min               0.25    0.25
load_tol 10.0
global_tol 5e-6
global_tol_slow 5e-6
global_tol_abs 1e-12
cg_tol 1e-10
point_tol 1e-6
point_tol_state 1e-7
point_tol_hardening 1e-6

## Started as v2 (the velocities of an isotropic viscoplastic solve and a yield-surface vertex
## stress), with the mid-nodes kept on the element edges as in v2's solves
initialization isotropic_viscoplastic
midnode_linearization on

## Output
print defrate_pl_eq
print slip
print sliprate
print coo
print restart
