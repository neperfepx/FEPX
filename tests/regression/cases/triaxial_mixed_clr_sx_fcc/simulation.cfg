## FEPX regression case triaxial_mixed_clr_sx_fcc (step 8.2c,
## addendum_triaxial_load_control.md §5 V5; not in v2: FEPX's own reference): every control mode
## of triaxial load control in one run, on the fcc single crystal of the landing run
## (tests/app/cases/landing_run.cfg) with the control component 33, 11 stress-controlled, 22 free:
## (1) 33 at a strain rate to 0.4 % (past yield), 11 in time to -20 MPa; (2) 33 unloaded at
## -200 MPa/s to 0 MPa (iteration (B), an unload episode), 11 in time to 0; (3) a dwell of 0.5 s at
## 0 MPa (stress_rate 0, a dwell episode), 11 held by its rate 0; (4) reloaded at a strain rate to
## 300 MPa, 11 on the load path to -30 MPa (iteration (A), landing). Checked by
## verification_fepx_triaxial_mixed_clr_sx_fcc (every increment on its values) and
## verification_fepx_rank_independence_triaxial_clr (1, 2, 4 ranks).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

boundary_conditions triaxial
control_component 33
number_of_steps 4
#                 comp  step 1  step 2  step 3  step 4
strain_rate       33    1.0e-3  -       -       1.0e-3
stress_rate       33    -      -200.0   0.0     -
target_strain     33    0.004   -       -       -
target_stress     33    -       0.0     -       300.0
target_duration         -       -       0.5     -
target_stress     11   -20.0    0.0     -      -30.0
stress_rate       11    -       -       0.0     -
number_of_incrs         8       4       -       -
dtime                   -       -       0.25    0.5
dtime_min               -       -       -       0.01
stress_tol 0.05

print coo
print stress
print strain
print strain_pl
print crss
print forces
