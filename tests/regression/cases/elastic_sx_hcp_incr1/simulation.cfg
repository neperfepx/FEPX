## FEPX regression case elastic_sx_hcp_incr1 (ROADMAP step 4.4): FEPX counterpart of the v2-fixed
## case elastic_sx_hcp_incr1 (single-crystal HCP cube (sx2.msh, 2 cells)), compared with its v2-fixed reference.
## Same material and loading; c33 = c11 + c12 - c13 for HCP (v2's constraint) and
## midnode_linearization on (v2 resets the tet mid-nodes, D26).

## Material
number_of_phases 1
phase 1
  crystal_type hcp
  model elastic
  c11 1.6966e5
  c12 0.8866e5
  c13 0.6166e5
  c33 1.96660e+05
  c44 0.4250e5

## Loading
boundary_conditions uniaxial_grip
number_of_steps 1
strain_rate   33 0.01
target_strain 33 0.00025
number_of_incrs  1
midnode_linearization on

## Output
print coo
print disp
print forces
print stress
print strain_el
