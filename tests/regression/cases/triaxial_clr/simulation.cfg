## FEPX regression case triaxial_clr (step 8.2c, addendum_triaxial_load_control.md §5 V3):
## v2-fixed case LEGACY_triaxial_clr in FEPX syntax (fcc unit cube, triaxial constant load rate
## 2 N/s on 33 to the loads (-37.5, 0, 100), (-93.75, 0, 250) and (0, 0, 0) N, 11 and 22
## load-controlled in time), started as v2 (initialization isotropic_viscoplastic), midnode_linearization on
## (the mid-nodes linearized as in v2's solves, kept in the stored coordinates since v2-fixed C65,
## D70). v2's load_tol_abs 5: load_tol 5. v2's n = nint(T/dt) equal increments
## (1, 3, 4) as number_of_incrs: FEPX's step durations start from the measured values (Q-T4),
## within 5 N of v2's previous targets, and D44's dtime rule would add a short last increment.
## Compared with the v2-fixed reference of LEGACY_triaxial_clr (tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.90
  tau_s 335.0
  n 1.0

boundary_conditions triaxial
control_component 33
number_of_steps 3
#                 comp  step 1  step 2  step 3
load_rate         33    2.0     2.0    -2.0
target_load       33    100.0   250.0   0.0
target_load       11   -37.50  -93.75   0.0
target_load       22    0.0     0.0     0.0
number_of_incrs         1       3       4
load_tol 5.0
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print vel
print crss
print defrate
print defrate_eq
print defrate_pl
print defrate_pl_eq
print ori
print slip
print sliprate
print spinrate
print rotrate
print strain
print strain_eq
print strain_el
print strain_el_eq
print strain_pl
print strain_pl_eq
print stress
print stress_eq
print velgrad
print work
print work_pl
print workrate
print workrate_pl
