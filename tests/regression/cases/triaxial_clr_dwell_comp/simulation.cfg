## FEPX regression case triaxial_clr_dwell_comp (step 8.2c, addendum_triaxial_load_control.md
## §5 V3, V4): v2-fixed case triaxial_clr_dwell_comp in FEPX syntax: LEGACY_triaxial_clr's
## material and control in compression (33 to -100 N, then -375 N, then 0 N at 2 N/s; 11 to 37.5,
## 140.625, 0 N in time; 22 at 0), two consecutive 20 s dwells after each of the first two load
## steps (dtime 5; every load held where the previous step left it, load_rate 0 on 11 and 22 too,
## as v2-fixed C98), max_strain_incr 0.002 (v2-fixed C60, C61). FEPX classifies the steps by the
## load's magnitude (Q-T9): the compression steps are loading (v2: unloading, finding F5) and the
## step to 0 unloading (v2: loading), so the episode starts and the first iterations differ from
## v2's; the loads converge to the same values within load_tol 0.1 (as the v2-fixed case; at 5 N
## the dwell loads drifted apart within the tolerance, step 8.5). midnode_linearization on
## (v2-fixed C65, D70); v2's equal load-step increments as number_of_incrs (see
## triaxial_clr). Compared with the v2-fixed reference of triaxial_clr_dwell_comp
## (tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.90
  tau_s 335.0
  n 1.0

boundary_conditions triaxial
control_component 33
number_of_steps 7
#                 comp  step 1  step 2  step 3  step 4  step 5  step 6  step 7
load_rate         33   -2.0     0.0     0.0    -2.0     0.0     0.0     2.0
target_load       33   -100.0   -       -      -375.0   -       -       0.0
target_duration         -       20.0    20.0    -       20.0    20.0    -
target_load       11    37.50   -       -       140.625 -       -       0.0
target_load       22    0.0     -       -       0.0     -       -       0.0
load_rate         11    -       0.0     0.0     -       0.0     0.0     -
load_rate         22    -       0.0     0.0     -       0.0     0.0     -
number_of_incrs         1       -       -       11      -       -       6
dtime                   -       5.0     5.0     -       5.0     5.0     -
load_tol 0.1
max_strain_incr 0.002
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print vel
print forces
print crss
print ori
print slip
print strain
print strain_el
print strain_pl
print stress
