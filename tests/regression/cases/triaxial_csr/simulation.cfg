## FEPX regression case triaxial_csr (step 8.2b, addendum_triaxial_load_control.md §5 V3):
## v2-fixed case LEGACY_triaxial_csr in FEPX syntax (hcp unit cube, triaxial constant strain rate
## on 11 in compression to the loads (-300, 0, 300) and (-600, 0, 600) N, 22 and 33 on each step's
## load path), with v2's constraint c33 = c11 + c12 - c13, started as v2 (initialization
## isotropic_viscoplastic), midnode_linearization on (v2's solves linearize the mid-nodes, and since
## v2-fixed C65 its triaxial drivers keep them in the stored coordinates as the uniaxial driver;
## D70). v2's tolerance max(load_tol_abs 10,
## load_tol_rel 0.01 |F_p|) is 10 N below 1000 N: load_tol 10 (above v2's overshoots: no landing
## attempt). v2 ignores the sign of its strain rate (the elastic estimate's sign); FEPX takes the
## signed rate (Q-L6). Compared with the v2-fixed reference of LEGACY_triaxial_csr
## (tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type hcp
  model crystal_plasticity
  c11 1.6966e5
  c12 0.8866e5
  c13 0.6166e5
  c33 1.9666e5
  c44 0.4250e5
  c_over_a 1.587
  m 0.01 0.01 0.01
  gammadot_0 1.0 1.0 1.0
  tau_0 390.0 468.0 663.0
  hardening saturation_isotropic
  h_0 190.0
  tau_s 530.0
  n 1.0

boundary_conditions triaxial
control_component 11
number_of_steps 2
#                 comp  step 1  step 2
strain_rate       11   -1e-4   -1e-4
target_load       11   -300.0  -600.0
target_load       22    0.0     0.0
target_load       33    300.0   600.0
dtime                   5.0     10.0
dtime_min               0.25    0.25
load_tol 10.0
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print vel
print crss
print defrate
print defrate_eq
print defrate_pl
print defrate_pl_eq
print ori
print slip
print sliprate
print spinrate
print rotrate
print strain
print strain_eq
print strain_el
print strain_el_eq
print strain_pl
print strain_pl_eq
print stress
print stress_eq
print velgrad
print work
print work_pl
print workrate
print workrate_pl
