## FEPX regression case mixed_unload_sx_fcc (step 8.1, addendum_load_targets.md §5 V4): mixed
## per-step targets, which v2 lacks: fcc single crystal (sx_fcc's material, sx2.msh) pulled to 1 %
## strain, unloaded to zero stress (target_stress 0, the increments chosen by v2's rule), then
## reloaded to 1.2 % strain (a step planned during the run from the strain reached). Every
## tolerance tightened; compared with FEPX's own reference (tests/regression/README.md).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

boundary_conditions uniaxial_grip
number_of_steps 3
strain_rate   33 0.01  -0.01 0.01
target_strain 33 0.010 -     0.012
target_stress 33 -     0.0   -
number_of_incrs  10    -     4
dtime            -     0.05  -
dtime_min        -     0.001 -
global_tol 1e-10
global_tol_slow 1e-10
global_tol_abs 1e-16
cg_tol 1e-13
point_tol 1e-11
point_tol_state 1e-12
point_tol_hardening 1e-12
point_max_iters_state 400

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
