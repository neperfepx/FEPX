## FEPX regression case elastic_sx_hcp_unload (ROADMAP step 5.4): FEPX counterpart of the
## v2-fixed case elastic_sx_hcp_unload (single-crystal HCP cube (sx2.msh), loaded to 1e-3 and
## unloaded to 5e-4), compared with its v2-fixed reference. Same material and loading; for HCP c33
## = c11 + c12 - c13 (v2's constraint); midnode_linearization on (v2 resets the tet mid-nodes,
## D26).

## Material
number_of_phases 1
phase 1
  crystal_type hcp
  model elastic
  c11 1.6966e5
  c12 0.8866e5
  c13 0.6166e5
  c33 1.96660e+05
  c44 0.4250e5

## Loading
boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01   -0.01
target_strain 33 0.0010 0.0005
number_of_incrs  2      2
midnode_linearization on

## Output
print coo
print disp
print vel
print forces
print ori
print stress
print strain_el
