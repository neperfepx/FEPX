## FEPX regression case tutorial_simple_rve (step 8.5; the manual's own
## inputs are in tutorials/): FEPX v2's tutorial of the same name
## (legacy/fepx2-fixed/doc/tutorials/simple_rve_simulation/simulation.cfg, with v2-fixed's
## "minimal" (CHANGES.md C89) and n 1.0 (C94)) in FEPX syntax: the simple simulation's
## conditions (z0 fixed along z, x0y0z0 along x and y, x1y0z0 along y) as the uniaxial_minimal
## preset, loaded by a strain rate to a strain target with strain increments (the same 10
## increments of 1 s). Compared with the v2-fixed reference of tutorial_simple_rve
## (tests/regression/README.md).

## Material
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.5e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 1
strain_rate   33 0.001
target_strain 33 0.01
dstrain          0.001

## Started as v2 (the velocities of an isotropic viscoplastic solve and a yield-surface vertex
## stress), with the mid-nodes kept on the element edges as in v2's solves
initialization isotropic_viscoplastic
midnode_linearization on

## Output
print coo
print ori
print stress
print strain
print forces
