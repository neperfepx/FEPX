## FEPX regression case irr_sx_bcc (step 7.3, D61): Kocks-Mecking hardening with irradiation
## softening (no v2 counterpart), bcc iron with Barton et al. (2013)'s parameters in FEPX units
## (addendum_irradiation.md §6: h_d 0.675, eta 100, loops 3.61e21 m^-3 = 3.61e12 /mm^3 of diameter
## 100 b, the four <111> normals), every tolerance tightened, compared with FEPX's own reference
## (reference/fepx; tests/regression/README.md). Elastic to 0.3 %, then 45 increments of 1e-4 through
## the peak stress (0.44 %) into the stress drop; the state loop damped (D62).
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 231.4e3
  c12 134.7e3
  c44 116.4e3
  m 0.05
  gammadot_0 1.0
  tau_0 90.0
  hardening kocks_mecking
  km_b 2.48e-7
  km_h_n 0.125
  km_k1 4.5e5
  km_k20 14.0
  km_gammadot_k0 1.0e10
  km_n 100.0
  km_rho_0 2.0e7
  irradiation on
  irr_h_d 0.675
  irr_eta 100.0
  irr_loop_density 3.61e12
  irr_loop_diameter 2.48e-5
  irr_loop_normals <111>

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.003 0.0075
number_of_incrs  3     45
initialization isotropic_viscoplastic
global_tol 1e-10
global_tol_slow 1e-10
global_tol_abs 1e-16
cg_tol 1e-13
point_tol 1e-11
point_tol_state 1e-12
point_tol_hardening 1e-12

print coo
print disp
print forces
print ori
print stress
print strain_el
print strain_pl
print crss
print slip
print sliprate
print km_rho
print km_k2
print km_rhorate
print dmg
print dmgrate
