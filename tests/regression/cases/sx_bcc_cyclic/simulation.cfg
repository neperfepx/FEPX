## FEPX regression case sx_bcc_cyclic (step 7.4b): v2-fixed case sx_bcc_cyclic in FEPX syntax, started
## as v2 (initialization isotropic_viscoplastic), compared with its v2-fixed reference
## (tests/regression/README.md).
## BCC with cyclic hardening (v2 test 16_bcc_cyclic_hard's parameters with the threshold
## a = 0.002 of poly_fcc_cyclic, reached during the run, c = 3.5), tension to 0.4 % then back
## to 0 at the same rate.
## v2 resets the accumulated slip at the reversal; FEPX resets on every
## reversal of the control strain rate (D59).
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 236.9e3
  c12 140.6e3
  c44 116.0e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.9
  tau_s 335.0
  n 1.0
  cyclic_hardening on
  cyclic_a 0.002
  cyclic_c 3.5

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  -0.01
target_strain 33 0.004 0.000
number_of_incrs  8     8
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
