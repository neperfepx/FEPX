## FEPX regression case sx_fcc_precip (step 7.1): v2-fixed case sx_fcc_precip in FEPX syntax, started as v2
## (initialization isotropic_viscoplastic), compared with its v2-fixed reference (tests/regression/README.md).
## Precipitate strengthening with both parameter sets (v2 case 41 values, a_p raised to 50 MPa): cutting
## tau_p = 56.6 MPa below bowing (102.7 MPa with the Hill shear modulus) governs. Lengths in m as v2's cases
## (only ratios enter).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0
  precipitate_strengthening on
  a_p 50.0
  f_p 8.0e-2
  b_p 2.5e-10
  r_p 4e-9
  b_m 2.0e-10
  c_p 1.6e-1

boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate   33 0.01  0.01
target_strain 33 0.002 0.010
number_of_incrs  5     5
initialization isotropic_viscoplastic
midnode_linearization on

print coo
print disp
print forces
print ori
print stress
print strain
print strain_el
print strain_pl
print crss
print slip
