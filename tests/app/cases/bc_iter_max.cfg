## max_bc_iter 1 on the isotropic elastic cube of fepx_iso_triaxial_csr: the first iteration
## needs a correction, so the run stops with the error (step 8.2b).

number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

boundary_conditions triaxial
control_component 11
number_of_steps 2
#                 comp  step 1  step 2
strain_rate       11   -1.0e-3 -1.0e-3
target_load       11   -300.0  -600.0
target_load       22    0.0     0.0
target_load       33    300.0   600.0
dtime                   0.5     0.5
dtime_min               0.01    0.01
load_tol 0.01
max_bc_iter 1

print stress
print strain_el
print forces
print convergence
