# Step 8.1 (addendum §3.6, v2-fixed C54): the v2-fixed necking case
# (tests/verification/cases/v2_necking_load_target) in FEPX syntax, started as v2: fcc single
# crystal with saturation strength 230 MPa pulled along z at 0.01 /s towards an unreachable load
# target of 1000 N with check_necking on. v2-fixed's load peaks at increment 22 (639.0 N) and
# falls at increment 23; FEPX must stop there too, writing step 1 from that increment.
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 230.0
  n 1.0
boundary_conditions uniaxial_grip
check_necking on
max_incr 40
number_of_steps 1
strain_rate 33 0.01
target_load 33 1000.0
dtime 1.0
dtime_min 0.01
initialization isotropic_viscoplastic
midnode_linearization on
print stress
print forces
