# Step 8.2a (dev/theory/addendum_triaxial_load_control.md §3.6, §5 V7): landing on a load target
# of an elastic-plastic crystal. fcc single crystal (load_target_unload's material) pulled along
# z at 0.01 /s to 400 N, near yield, then unloaded to 0 N, with dtime 0.1 s and dtime_factor 2.0:
# the aimed third increment passes 400 N by more than load_tol 0.1 N and, the response bending
# over at yield, false position needs 5 attempts to land (measured 2026-10-17: 408.5 N, then
# 403.5, 401.4, 400.57, 400.23 and 400.09 N); the elastic unloading step lands in 1 attempt.
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0
boundary_conditions uniaxial_grip
number_of_steps 2
strain_rate 33 0.01 -0.01
target_load 33 400.0 0.0
dtime          0.1   0.1
dtime_min      0.001 0.002
dtime_factor   2.0
initialization isotropic_viscoplastic
midnode_linearization on
print stress
print forces
print convergence
