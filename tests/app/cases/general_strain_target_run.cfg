## Run case: general conditions (as v2 case 65) with a compressive strain target, so that the
## set_bc velocities are reversed (step_schedule_mod vel_factor -1). Rate max |v| / L = 1e-3/s.
number_of_phases 1
phase 1
  crystal_type hcp
  model elastic
  c11 162400.0
  c12 92000.0
  c13 69000.0
  c33 180700.0
  c44 46700.0
boundary_conditions general
set_bc vel x0y0z0 x 0 y 0 z 0
set_bc vel x1y0z0 y 0
set_bc vel z0 z 0.0
set_bc vel z1 z 1.0e-3
number_of_steps 1
target_strain 33 -1.0e-4
number_of_incrs 1
print disp
