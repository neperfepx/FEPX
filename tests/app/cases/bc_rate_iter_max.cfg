# Step 8.2c (dev/theory/addendum_triaxial_load_control.md §3.4, §5 V6): iteration (B) beyond
# max_bc_iter. The creep case of verification_fepx_fcc_sx_creep_dwell with max_bc_iter 1: the
# first increment's scaling loop needs more than one iteration; the run stops with the error.
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

boundary_conditions uniaxial_grip
number_of_steps 4
#                 comp  step 1  step 2  step 3  step 4
load_rate         33    100.0   0.0     0.0    -200.0
target_load       33    440.0   -       -       100.0
target_duration         -       2.0     1.0     -
number_of_incrs         8       -       -       3
dtime                   -       0.5     0.5     -
max_strain_incr 2.0e-4
max_bc_iter 1
initialization isotropic_viscoplastic

print stress
print forces
print convergence
