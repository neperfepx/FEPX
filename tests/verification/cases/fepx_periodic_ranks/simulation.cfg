## FEPX verification case fepx_periodic_ranks (step 8.3b, addendum §5 V5): a periodic 8-grain
## fcc polycrystal (Neper periodic tessellation, the grains crossing the boundary) with crystal
## plasticity, small strain, Fbar-dot 33 imposed and the others free, run on 1, 2 and 4 ranks
## (even partitioning: relations cross the partitions); the stresses must agree to 1e-7.

## Material
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.5e3
  m 0.05
  gammadot_0 1.0
  tau_0 100.0
  hardening saturation_isotropic
  h_0 300.0
  tau_s 200.0
  n 1.0

## Loading
boundary_conditions periodic
control_component 33
strain_rate 33 1.0e-3
number_of_steps 1
target_strain 33 0.004
number_of_incrs 4

## Output
print stress
