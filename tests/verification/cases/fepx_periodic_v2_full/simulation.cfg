## FEPX verification case fepx_periodic_v2_full (step 8.3b, addendum §5 V2): periodic
## conditions, deformation_gradient_rate with Fbar-dot 11 = 1e-3 and 12 = 13 = 23 = 0 imposed
## (21, 31, 32, 22, 33 free: v2-fixed C70's configuration, no free rotation), on the periodic cube:
## uniaxial stress, homogeneous, the free stress components zero, the lateral rates -nu L11.

## Material: isotropic elastic (c44 = (c11 - c12)/2), so the polycrystal is homogeneous
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions periodic
periodic_kinematics deformation_gradient_rate
periodic_preconditioner exact_diagonal
control_component 11
strain_rate 11 1.0e-3
strain_rate 12 0.0
strain_rate 13 0.0
strain_rate 23 0.0
number_of_steps 1
target_strain 11 2.0e-3
number_of_incrs 2

## Output
print coo
print vel
print stress
