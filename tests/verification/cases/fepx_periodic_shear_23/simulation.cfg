## FEPX verification case fepx_periodic_shear_23 (step 9.6, ROADMAP D88): periodic conditions controlled
## by the shear component 23 (small_strain), pure shear: the tensor component 23 (and 32) imposed, every other component free. Isotropic elastic one-cell cube, two steps
## with a reversal: the solution is homogeneous, the free components stress free and the stress
## C : e (check_periodic.py; tests/verification/README.md).

## Material: isotropic elastic (c44 = (c11 - c12)/2)
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions periodic
periodic_kinematics small_strain
control_component 23
strain_rate 23  1.0e-3  -1.0e-3
number_of_steps 2
target_strain 23 2.0e-5 1.0e-5
number_of_incrs 2 2

## Output
print coo
print vel
print stress
