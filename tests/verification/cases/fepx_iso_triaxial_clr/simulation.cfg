## Verification case fepx_iso_triaxial_clr (step 8.2c, addendum_triaxial_load_control.md §5 V1):
## the isotropic elastic unit cube of fepx_iso_triaxial_csr (lambda 1e5 MPa, mu 5e4 MPa) under
## triaxial load control at a constant load rate (iteration (B), v2 CLR): the control component
## 33 at 100 N/s to 200 N, then at -100 N/s back to 0 N; 11 and 22 load-controlled in time (to
## -100 and 50 N, then to 0). Checked by check_triaxial_load_control.py: every increment's three
## loads on their values in time within load_tol, Hooke's law and the face stresses at both steps.

## Material
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions triaxial
control_component 33
number_of_steps 2
#                 comp  step 1  step 2
load_rate         33    100.0  -100.0
target_load       33    200.0   0.0
target_load       11   -100.0   0.0
target_load       22    50.0    0.0
number_of_incrs         4       4
load_tol 0.01

## Output
print stress
print strain_el
print forces
print convergence
