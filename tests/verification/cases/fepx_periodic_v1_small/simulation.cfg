## FEPX verification case fepx_periodic_v1_small (step 8.3b, addendum §5 V1, V3): periodic
## conditions, small strain, all six components imposed, on the periodic 2 x 1 x 1 box (Neper
## periodic tessellation: non-planar boundaries, non-cubic), two steps whose rates change
## differently (per-step offsets, Q-P5): the solution is homogeneous, the relations exact, Fbar-dot
## symmetric, and at these small strains the stress is C : e.

## Material: isotropic elastic (c44 = (c11 - c12)/2), so the polycrystal is homogeneous
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions periodic
control_component 11
strain_rate 11  1.0e-3  2.0e-3
strain_rate 22 -2.0e-4  1.0e-4
strain_rate 33  3.0e-4 -3.0e-4
strain_rate 23  1.0e-4  4.0e-4
strain_rate 13 -1.5e-4  0.0
strain_rate 12  2.0e-4 -1.0e-4
number_of_steps 2
target_strain 11 2.0e-5 6.0e-5
number_of_incrs 2 2

## Output
print coo
print vel
print stress
