## Verification case fepx_bct_sx_uniaxial_elastic (ROADMAP step 4.4): BCT single crystal
## (beta-tin constants of v2's BCT cases), elastic, c-axis rotated 45 deg about x (mesh
## tests/verification/cases/meshes/sx2_rotx45.msh), uniaxial stress along z to 1e-4 strain in one
## increment. Checked against the analytic compliance by check_uniaxial_elastic.py.

## Material
number_of_phases 1
phase 1
  crystal_type bct
  model elastic
  c11 72.3e3
  c12 59.4e3
  c13 35.8e3
  c33 88.4e3
  c44 22.0e3
  c66 24.0e3

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 1
strain_rate   33 1.0e-3
target_strain 33 1.0e-4
number_of_incrs  1

## Output
print stress
print strain_el
