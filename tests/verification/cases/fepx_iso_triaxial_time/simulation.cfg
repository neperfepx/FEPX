## Verification case fepx_iso_triaxial_time (step 8.2b, addendum_triaxial_load_control.md §3.1,
## Q-T8 (ii), §5 V1): the isotropic elastic unit cube of fepx_iso_triaxial_csr with the control
## component 33 strain-controlled (to 2e-3, then back to 1e-3), component 11 stress-controlled
## in time (to -50 MPa, then to 0 MPa: its stress interpolated linearly in time over each step)
## and 22 free. Checked by check_triaxial_load_control.py: every increment on the time-based
## values within stress_tol, Hooke's law and the face stresses at both steps.

## Material
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions triaxial
control_component 33
number_of_steps 2
#                 comp  step 1  step 2
strain_rate       33    1.0e-3 -1.0e-3
target_strain     33    2.0e-3  1.0e-3
target_stress     11   -50.0    0.0
number_of_incrs         4       4
stress_tol 0.01

## Output
print stress
print strain_el
print forces
print convergence
