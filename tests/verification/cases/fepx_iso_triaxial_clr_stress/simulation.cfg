## Verification case fepx_iso_triaxial_clr_stress (step 8.2c, addendum_triaxial_load_control.md
## §3.1, §3.3, §5 V1, V4): the isotropic elastic unit cube of fepx_iso_triaxial_csr under
## triaxial stress control (iteration (B)): the control component 33 at 50 MPa/s to 100 MPa, a
## dwell of 1 s (stress_rate 0, target_duration; dtime 0.25: v2's dwell increments 0.0025, then
## dtime, the last one ending the dwell), then at -50 MPa/s to 0 MPa; 11 given by its stress
## rate (-10, 0, 10 MPa/s: rate rows), 22 stress-controlled in time (to 20 MPa, held, then 0).
## Elastic: the dwell has no creep (the face velocities vanish: v2-fixed C60's lower bound of the
## perturbations, finding F1). Checked by check_triaxial_load_control.py: every increment's
## stresses on their values within stress_tol, Hooke's law and the face stresses at every step.

## Material
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions triaxial
control_component 33
number_of_steps 3
#                 comp  step 1  step 2  step 3
stress_rate       33    50.0    0.0    -50.0
target_stress     33    100.0   -       0.0
target_duration         -       1.0     -
stress_rate       11   -10.0    0.0     10.0
target_stress     22    20.0    20.0    0.0
number_of_incrs         4       -       4
dtime                   -       0.25    -
stress_tol 0.01
max_strain_incr 1.0e-4

## Output
print stress
print strain_el
print forces
print convergence
