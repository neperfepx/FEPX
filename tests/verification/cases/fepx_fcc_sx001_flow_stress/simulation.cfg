phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 168400
  c12 121400
  c44 75400
  m 0.02
  gammadot_0 1.0
  tau_0 100.0
  hardening none
boundary_conditions uniaxial_minimal
number_of_steps 1
strain_rate 33 1.0e-3
