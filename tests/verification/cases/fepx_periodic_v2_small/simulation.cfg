## FEPX verification case fepx_periodic_v2_small (step 8.3b, addendum §5 V2, V3): periodic
## conditions, small strain, only Fbar-dot 11 imposed (the other five free: no rows), on the
## periodic 2 x 1 x 1 box: uniaxial stress, homogeneous, the free stress components zero, the
## lateral rates -nu L11 (nu = c12 / (c11 + c12) = 1/3), Fbar-dot symmetric.

## Material: isotropic elastic (c44 = (c11 - c12)/2), so the polycrystal is homogeneous
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions periodic
control_component 11
strain_rate 11 1.0e-3
number_of_steps 1
target_strain 11 2.0e-3
number_of_incrs 2

## Output
print coo
print vel
print stress
