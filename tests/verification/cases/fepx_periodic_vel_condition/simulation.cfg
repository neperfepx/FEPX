## FEPX verification case fepx_periodic_vel_condition (step 8.3b, addendum §3.3 Q-P6): periodic
## conditions with a velocity condition on an independent dof (node 2, the primary of the x drive
## pair: all three components 0, which fixes the translation instead of the zero-mean
## fluctuation), small strain, all six components imposed, the exact Jacobi diagonal, on the
## periodic 2 x 1 x 1 box: homogeneous, the relations exact.

## Material: isotropic elastic (c44 = (c11 - c12)/2), so the polycrystal is homogeneous
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions periodic
periodic_preconditioner exact_diagonal
control_component 22
strain_rate 11  5.0e-4
strain_rate 22 -1.0e-3
strain_rate 33  2.0e-4
strain_rate 23  0.0
strain_rate 13  1.0e-4
strain_rate 12 -2.0e-4
set_bc vel 2 x 0.0 y 0.0 z 0.0
number_of_steps 1
target_strain 22 -2.0e-3
number_of_incrs 2

## Output
print coo
print vel
print stress
