## FEPX verification case fepx_periodic_shear_31 (step 9.6, ROADMAP D88): periodic conditions controlled
## by the shear component 31 (deformation_gradient_rate), simple shear: Fbar-dot 31 imposed, 13 imposed at zero (no rigid rotation), one component of each other shear pair imposed at zero (unique solution), the rest free. Isotropic elastic one-cell cube, two steps
## with a reversal: the solution is homogeneous, the free components stress free and the stress
## C : e (check_periodic.py; tests/verification/README.md).

## Material: isotropic elastic (c44 = (c11 - c12)/2)
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions periodic
periodic_kinematics deformation_gradient_rate
control_component 31
strain_rate 31  1.0e-3  -1.0e-3
strain_rate 13  0.0      0.0
strain_rate 21  0.0      0.0
strain_rate 32  0.0      0.0
number_of_steps 2
target_strain 31 2.0e-5 1.0e-5
number_of_incrs 2 2

## Output
print coo
print vel
print stress
