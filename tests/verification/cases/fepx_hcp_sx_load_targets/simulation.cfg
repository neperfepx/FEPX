## Verification case fepx_hcp_sx_load_targets (ROADMAP step 8.1, addendum_load_targets.md §5
## V1-V2): the elastic HCP single crystal of fepx_hcp_sx_uniaxial_elastic (mesh
## sx2_rotx45.msh), uniaxial stress along z: to a stress target of 50 MPa, then in compression to
## a load target of -20 N, then back to zero stress, each at |strain rate| 1e-3 /s with
## increments of at most 0.1 s (0.07 s in step 3, so that its last increment is aimed);
## dtime_factor 1.5 makes the overshoot of the aimed last increment
## large enough to check (check_load_target.py). Step 8.2a: stress_tol 2.5 MPa and load_tol 1.0 N,
## above the overshoots (1.6 MPa, 0.71 N, 1.8 MPa) and below the distance of every earlier
## increment to its target, so that no increment is redone by the landing rule (that rule:
## fepx_hcp_sx_landing).

## Material
number_of_phases 1
phase 1
  crystal_type hcp
  model elastic
  c11 162400.0
  c12 92000.0
  c13 69000.0
  c33 180700.0
  c44 46700.0

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 3
strain_rate   33 1.0e-3 -1.0e-3 1.0e-3
target_stress 33 50.0    -       0.0
target_load   33 -      -20.0    -
dtime            0.1     0.1     0.07
dtime_min        1.0e-4  1.0e-4  1.0e-4
dtime_factor     1.5
stress_tol       2.5
load_tol         1.0

## Output
print stress
print forces
