## Verification case fepx_fcc_sx001_flow_stress_block_jacobi (step 9.2, addendum_block_jacobi.md §6 T6): the
## case fepx_fcc_sx001_flow_stress (crystal plasticity: SA and NR solves) with cg_preconditioner block_jacobi,
## against the same steady power-law flow stress.
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 168400
  c12 121400
  c44 75400
  m 0.02
  gammadot_0 1.0
  tau_0 100.0
  hardening none
boundary_conditions uniaxial_minimal
number_of_steps 1
strain_rate 33 1.0e-3
target_strain 33 0.01
number_of_incrs 20
print stress
print strain_el

## Solver (step 9.2)
cg_preconditioner block_jacobi
