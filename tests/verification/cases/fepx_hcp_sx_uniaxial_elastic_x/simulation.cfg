## Verification case fepx_hcp_sx_uniaxial_elastic_x (ROADMAP step 4.4): HCP single crystal,
## elastic, c33 independent (D3; titanium constants), c-axis rotated 45 deg about x (mesh
## tests/verification/cases/meshes/sx2_rotx45.msh), uniaxial stress along x to 1e-4 strain in one
## increment. Checked against the analytic compliance by check_uniaxial_elastic.py.

## Material
number_of_phases 1
phase 1
  crystal_type hcp
  model elastic
  c11 162400.0
  c12 92000.0
  c13 69000.0
  c33 180700.0
  c44 46700.0

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 1
strain_rate   11 1.0e-3
target_strain 11 1.0e-4
number_of_incrs  1

## Output
print stress
print strain_el
