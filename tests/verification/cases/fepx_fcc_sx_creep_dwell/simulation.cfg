## Verification case fepx_fcc_sx_creep_dwell (step 8.2c, addendum_triaxial_load_control.md §3.3,
## §5 V4): creep in a dwell above yield. fcc single crystal (the material of the landing run,
## tests/app/cases/landing_run.cfg: yield near 400 N) under uniaxial_grip at a constant load rate
## (iteration (B) on 33): 100 N/s to 440 N, a dwell of 2 s (load_rate 0, target_duration, dtime
## 0.5, max_strain_incr 2e-4), a second dwell of 1 s (a dwell after a dwell: no 0.01 dtime start),
## then unloading at -200 N/s to 100 N. Checked by check_dwell.py: the load held within load_tol of
## its start value at every dwell increment, the crystal creeping (the face moving on), and v2's
## dwell increments (0.01 dtime at an episode start, then min(max_strain_incr L0 / |V|, dtime) with
## V the previous increment's face velocity, the last one ending the dwell at its time).
number_of_phases 1
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 245.0e3
  c12 155.0e3
  c44 62.50e3
  m 0.05
  gammadot_0 1.0
  tau_0 210.0
  hardening saturation_isotropic
  h_0 200.0
  tau_s 330.0
  n 1.0

boundary_conditions uniaxial_grip
number_of_steps 4
#                 comp  step 1  step 2  step 3  step 4
load_rate         33    100.0   0.0     0.0    -200.0
target_load       33    440.0   -       -       100.0
target_duration         -       2.0     1.0     -
number_of_incrs         8       -       -       3
dtime                   -       0.5     0.5     -
max_strain_incr 2.0e-4
initialization isotropic_viscoplastic

print stress
print forces
print convergence
