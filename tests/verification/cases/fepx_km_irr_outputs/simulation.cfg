## FEPX verification case fepx_km_irr_outputs (step 9.6, ROADMAP D88): the Kocks-Mecking and
## irradiation outputs (km_rho, km_k2, km_rhorate, dmg, dmgrate) checked against each other and
## against the laws by check_km_irr_outputs.py (tests/verification/README.md). Material of
## irr_sx_bcc (bcc iron, Barton et al. 2013; addendum_irradiation.md §6) on sx2.msh, default
## tolerances; elastic to 0.3 % in one increment, then one increment per step to 0.5 %, so that
## consecutive steps are the start and end of one increment.
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 231.4e3
  c12 134.7e3
  c44 116.4e3
  m 0.05
  gammadot_0 1.0
  tau_0 90.0
  hardening kocks_mecking
  km_b 2.48e-7
  km_h_n 0.125
  km_k1 4.5e5
  km_k20 14.0
  km_gammadot_k0 1.0e10
  km_n 100.0
  km_rho_0 2.0e7
  irradiation on
  irr_h_d 0.675
  irr_eta 100.0
  irr_loop_density 3.61e12
  irr_loop_diameter 2.48e-5
  irr_loop_normals <111>

boundary_conditions uniaxial_grip
number_of_steps 5
strain_rate   33 0.01  0.01   0.01  0.01   0.01
target_strain 33 0.003 0.0035 0.004 0.0045 0.005
number_of_incrs  1     1      1     1      1
initialization isotropic_viscoplastic

print sliprate
print km_rho
print km_k2
print km_rhorate
print dmg
print dmgrate
