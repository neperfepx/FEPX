## FEPX verification case fepx_periodic_v1_full (step 8.3b, addendum §5 V1): periodic
## conditions with the nine components of Fbar-dot imposed (deformation_gradient_rate, a
## non-symmetric rate), on the periodic one-cell cube (planar faces; the three drive pairs share
## one primary node): the solution is homogeneous, every element's velocity gradient is
## L = Fbar-dot Fbar^-1, the relations exact.

## Material: isotropic elastic (c44 = (c11 - c12)/2), so the polycrystal is homogeneous
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions periodic
periodic_kinematics deformation_gradient_rate
control_component 11
strain_rate 11  1.0e-3
strain_rate 12  4.0e-4
strain_rate 13 -2.0e-4
strain_rate 21 -1.0e-4
strain_rate 22 -3.0e-4
strain_rate 23  2.5e-4
strain_rate 31  3.0e-4
strain_rate 32 -1.5e-4
strain_rate 33  5.0e-4
number_of_steps 1
target_strain 11 0.01
number_of_incrs 4

## Output
print coo
print vel
print stress
print velgrad
