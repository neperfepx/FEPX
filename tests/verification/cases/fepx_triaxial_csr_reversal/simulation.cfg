## FEPX verification case fepx_triaxial_csr_reversal (step 8.5, ROADMAP D86): the material and
## mesh of triaxial_csr (LEGACY_triaxial_csr, hcp unit cube), triaxial constant strain rate on
## 11 in compression to -300 N, then reversed to unload to -100 N, 22 and 33 on each step's load
## path. Step 2's first boundary-velocity iteration starts from step 1's face velocities times -1
## (v2 vel_factor, addendum_triaxial_load_control.md §3.4 revised; check_step_change_velocities.py).

number_of_phases 1
phase 1
  crystal_type hcp
  model crystal_plasticity
  c11 1.6966e5
  c12 0.8866e5
  c13 0.6166e5
  c33 1.9666e5
  c44 0.4250e5
  c_over_a 1.587
  m 0.01 0.01 0.01
  gammadot_0 1.0 1.0 1.0
  tau_0 390.0 468.0 663.0
  hardening saturation_isotropic
  h_0 190.0
  tau_s 530.0
  n 1.0

## Loading
boundary_conditions triaxial
control_component 11
number_of_steps 2
#                 comp  step 1  step 2
strain_rate       11   -1e-4    1e-4
target_load       11   -300.0  -100.0
target_load       22    0.0     0.0
target_load       33    300.0   100.0
dtime                   5.0     10.0
dtime_min               0.25    0.25
load_tol 10.0
initialization isotropic_viscoplastic
midnode_linearization on
print forces
