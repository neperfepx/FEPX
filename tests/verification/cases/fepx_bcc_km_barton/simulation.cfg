## Verification case fepx_bcc_km_barton (step 7.2, D60; addendum_kocks_mecking.md §9 item 6):
## an approximate comparison with Barton, Arsenlis & Marian (2013), Fig. 3 (the network term b mu_0 sqrt(h_n km_rho)).
## Unirradiated bcc iron with Barton's Table 1 parameters in FEPX units (b 2.48e-7 mm, h_n 0.125,
## k_1 = 450 sqrt(1e6 /mm^2) = 4.5e5 /mm, k_20 14, n 100, gammadot_k0 1e10 /s, tau_0 90 MPa,
## gammadot_0 3e4 /s, m 0.05; km_rho(0) = 2e13 /m^2 = 2e7 /mm^2 from Barton's §3.2), slightly off
## [100] (5 degrees about [1 2 0], sx2_off100.msh), uniaxial at 100 /s to 4 % strain. mu_0 is
## Hill's average of iron's elastic constants (81.8 GPa; Barton 86 GPa). FEPX's bcc crystal has the
## {110} and {112} families (24 systems; Barton also {123}, 48 systems).
number_of_phases 1
phase 1
  crystal_type bcc
  model crystal_plasticity
  c11 231.4e3
  c12 134.7e3
  c44 116.4e3
  slip_families {110}<111> {112}<111>
  m 0.05 0.05
  gammadot_0 3.0e4 3.0e4
  tau_0 90.0 90.0
  hardening kocks_mecking
  km_b 2.48e-7
  km_h_n 0.125
  km_rho_0 2.0e7
  km_k1 4.5e5
  km_k20 14.0
  km_gammadot_k0 1.0e10
  km_n 100.0

boundary_conditions uniaxial_minimal
number_of_steps 8
strain_rate   33 100.0 100.0 100.0 100.0 100.0 100.0 100.0 100.0
target_strain 33 0.005 0.010 0.015 0.020 0.025 0.030 0.035 0.040
number_of_incrs  5     5     5     5     5     5     5     5

print stress
print strain_pl_eq
print crss
print km_rho
print km_k2
