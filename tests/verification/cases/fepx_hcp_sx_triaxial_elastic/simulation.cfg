## Verification case fepx_hcp_sx_triaxial_elastic (ROADMAP step 5.3, D45): HCP single crystal
## (titanium constants, c33 independent) with its c-axis along y (mesh sx2_rotx90.msh), so that
## the sample-frame stiffness does not couple normal and shear components, under triaxial
## strain control: control component 33 (load to 2e-3, then back to 1e-3), component 11 by
## rates, component 22 by targets. Checked at the end of step 2 against the homogeneous
## solution by check_triaxial_elastic.py (expected strains 11 -2e-4, 22 -3e-4, 33 1e-3).

## Material
number_of_phases 1
phase 1
  crystal_type hcp
  model elastic
  c11 162400.0
  c12 92000.0
  c13 69000.0
  c33 180700.0
  c44 46700.0

## Loading
boundary_conditions triaxial
control_component   33
number_of_steps 2
#                   comp  step 1    step 2
strain_rate         33    1.0e-3    -1.0e-3
target_strain       33    2.0e-3     1.0e-3
strain_rate         11   -0.25e-3    0.3e-3
target_strain       22   -6.0e-4    -3.0e-4
number_of_incrs           4          -
dstrain                   -          2.5e-4

## Output
print stress
print strain_el
