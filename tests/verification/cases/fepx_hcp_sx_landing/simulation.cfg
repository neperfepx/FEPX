## Verification case fepx_hcp_sx_landing (ROADMAP step 8.2a, addendum_triaxial_load_control.md
## §3.6 and §5 V7): fepx_hcp_sx_load_targets with the default tolerances stress_tol 0.1 MPa and
## load_tol 0.1 N. dtime_factor 1.5 aims the last increment of each step past its target by more
## than the tolerance, so that increment is redone by false position on its length; the response
## being elastic (linear in the increment length up to the small geometry change), one attempt
## lands on the target (check_landing.py), and the stresses and elastic strains of the landed
## step 1 obey Hooke's law (check_uniaxial_elastic.py, fepx_hcp_sx_landing_hooke).

## Material
number_of_phases 1
phase 1
  crystal_type hcp
  model elastic
  c11 162400.0
  c12 92000.0
  c13 69000.0
  c33 180700.0
  c44 46700.0

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 3
strain_rate   33 1.0e-3 -1.0e-3 1.0e-3
target_stress 33 50.0    -       0.0
target_load   33 -      -20.0    -
dtime            0.1     0.1     0.07
dtime_min        1.0e-4  1.0e-4  1.0e-4
dtime_factor     1.5

## Output
print stress
print strain_el
print forces
