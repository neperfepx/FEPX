## Step 9.1 (ROADMAP D93): fepx_output_hdf5 with output_format hdf5 alone: no .sim summary and no
## text result files; the HDF5 and XDMF files identical to those of fepx_output_hdf5.

## Material
number_of_phases 2
phase 1
  crystal_type fcc
  model crystal_plasticity
  c11 204.6e3
  c12 137.7e3
  c44 126.2e3
  m 0.02
  gammadot_0 1.0
  tau_0 200.0
  hardening saturation_isotropic
  h_0 391.90
  tau_s 335.0
  n 1.0
phase 2
  crystal_type hcp
  model crystal_plasticity
  c11 1.6966e5
  c12 0.8866e5
  c13 0.6166e5
  c33 1.9666e5
  c44 0.4250e5
  c_over_a 1.587
  m 0.02 0.02 0.02
  gammadot_0 1.0 1.0 1.0
  tau_0 190.0 230.0 330.0
  hardening saturation_anisotropic
  h_0 190.0
  tau_s 400.0
  n 1.0

## Loading
boundary_conditions uniaxial_grip
number_of_steps 3
strain_rate   33 0.01  0.01  0.01
target_strain 33 0.002 0.004 0.006
number_of_incrs  2     1     1
print_results    1     0     1

## Output
output_format hdf5
print coo
print disp
print vel
print forces
print convergence
print ori
print stress
print strain_el
print crss
print slip
print sliprate
print rss
print strain_pl
print strain_pl_eq
print defrate_pl
print spinrate
print rotrate
print work
print strain
print strain_eq
print strain_el_eq
print stress_eq
print defrate
print defrate_eq
print defrate_pl_eq
print velgrad
print rotrate_spin
print rotrate_slip
print work_pl
print workrate
print workrate_pl
print strain_pl_sample
print strain_pl_sample_eq
