## Verification case fepx_iso_triaxial_csr (step 8.2b, addendum_triaxial_load_control.md §5 V1):
## isotropic elastic unit cube (cubic constants with c44 = (c11 - c12)/2: lambda 1e5 MPa,
## mu 5e4 MPa, E 1.3333e5 MPa, nu 1/3) under triaxial load control at a constant strain rate on
## the control component 11 (compression), the components 22 and 33 load-controlled on each
## step's load path (v2 CSR; LEGACY_triaxial_csr's targets). Checked by
## check_triaxial_load_control.py: every increment on the path within load_tol, the landing of
## each step, Hooke's law and the face stresses at both steps.

## Material
number_of_phases 1
phase 1
  crystal_type fcc
  model elastic
  c11 200000.0
  c12 100000.0
  c44 50000.0

## Loading
boundary_conditions triaxial
control_component 11
number_of_steps 2
#                 comp  step 1  step 2
strain_rate       11   -1.0e-3 -1.0e-3
target_load       11   -300.0  -600.0
target_load       22    0.0     0.0
target_load       33    300.0   600.0
dtime                   0.5     0.5
dtime_min               0.01    0.01
load_tol 0.01

## Output
print stress
print strain_el
print forces
print convergence
