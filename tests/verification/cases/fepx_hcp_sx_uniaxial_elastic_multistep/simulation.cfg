## Verification case fepx_hcp_sx_uniaxial_elastic_multistep (ROADMAP step 5.2): the HCP single
## crystal of fepx_hcp_sx_uniaxial_elastic (titanium constants, c33 independent, c-axis rotated
## 45 deg about x, mesh sx2_rotx45.msh), uniaxial stress along z loaded to 2e-4 strain in 5
## increments, then unloaded to 1e-4 with dtime 0.03 s (3 full increments and a shortened one),
## with the geometry updated after every increment. Checked at both step ends against the
## analytic compliance by check_uniaxial_elastic.py.

## Material
number_of_phases 1
phase 1
  crystal_type hcp
  model elastic
  c11 162400.0
  c12 92000.0
  c13 69000.0
  c33 180700.0
  c44 46700.0

## Loading
boundary_conditions uniaxial_minimal
number_of_steps 2
strain_rate   33 1.0e-3 -1.0e-3
target_strain 33 2.0e-4  1.0e-4
number_of_incrs  5       -
dtime            -       0.03

## Output
print stress
print strain_el
